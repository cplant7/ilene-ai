<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ilene.ai | AI transformation that works</title>
    <meta
      name="description"
      content="ilene.ai helps organizations find where AI belongs, redesign the workflow, implement the right solution and measure the operating value."
    />
    <link rel="stylesheet" href="styles.css?v=20260918-3" />
  </head>
  <body class="landing-body">
    <main class="landing" id="landing">
      <button
        class="landing-stage"
        id="enterSite"
        type="button"
        aria-label="Enter ilene.ai services"
      >
        <span class="power-mark" aria-hidden="true">
          <span class="tile-orbit" id="tileOrbit"></span>
          <svg class="power-symbol" viewBox="0 0 320 320" role="img">
            <defs>
              <linearGradient id="powerGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#06a4f5" />
                <stop offset="1" stop-color="#1457f5" />
              </linearGradient>
            </defs>
            <path
              class="power-arc power-arc-left"
              d="M104 67A118 118 0 0 0 160 278"
            />
            <path
              class="power-arc power-arc-right"
              d="M160 278A118 118 0 0 0 216 67"
            />
            <path class="power-line" d="M160 28V158" />
          </svg>
          <span
            class="logo-crop landing-wordmark"
            role="img"
            aria-label="ilene.ai"
          >
            <img src="assets/ilene-ai-logo.png" alt="" />
          </span>
        </span>
        <span class="landing-statement"
          >AI belongs where it improves the work</span
        >
        <span class="landing-action">Enter Services</span>
      </button>
      <a class="landing-skip" href="solutions.html">Skip motion</a>
    </main>
    <script>
      (function () {
        var stage = document.getElementById("enterSite");
        var landing = document.getElementById("landing");
        var reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        var orbit = document.getElementById("tileOrbit");
        var leaving = false;
        var timer;
        var colours = [
          ["#0b84f3", "#dff3ff"],
          ["#071f3a", "#4f6f91"],
          ["#29b6c9", "#d9fbff"],
          ["#f0b35a", "#fff0cf"],
          ["#2f6dd5", "#8fcaff"],
          ["#416b4d", "#cce8d3"],
          ["#9f6a43", "#f5d0aa"],
          ["#5f6f86", "#d8e2ed"],
        ];
        var starts = [
          [-270, -120],
          [-190, 130],
          [-110, -170],
          [-40, 150],
          [20, -135],
          [85, 165],
          [145, -155],
          [230, 105],
          [285, -70],
          [-245, 40],
          [-155, -35],
          [-70, 75],
          [0, -205],
          [65, 65],
          [125, -55],
          [185, 25],
          [250, 150],
          [-280, 165],
          [-25, 205],
          [285, 55],
        ];

        for (var i = 0; i < 20; i += 1) {
          var card = document.createElement("span");
          var angle = i * 18;
          var palette = colours[i % colours.length];
          card.className = "orbit-card";
          card.style.setProperty("--a", angle + "deg");
          card.style.setProperty("--na", -angle + "deg");
          card.style.setProperty("--x", starts[i][0] + "px");
          card.style.setProperty("--y", starts[i][1] + "px");
          card.style.setProperty("--line-x", (i - 9.5) * 28 + "px");
          card.style.setProperty("--r", (i % 5) * 7 - 14 + "deg");
          card.style.animationDelay = i * 34 + "ms";
          card.style.background =
            "linear-gradient(145deg," + palette[0] + "," + palette[1] + ")";
          orbit.appendChild(card);
        }

        function enterServices() {
          if (leaving) return;
          leaving = true;
          window.clearTimeout(timer);
          landing.classList.add("landing-exit");
          window.setTimeout(
            function () {
              window.location.href = "solutions.html";
            },
            reducedMotion ? 0 : 900,
          );
        }

        stage.addEventListener("click", enterServices);
        if (!reducedMotion) timer = window.setTimeout(enterServices, 7400);
      })();
    </script>
  </body>
</html>
